name: Android CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release even without a git tag?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  test_and_build:
    name: Test and Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Determine App Version
        id: get_version
        run: |
          # Try extracting versionName from build.gradle.kts
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$VERSION" ]; then
            VERSION="1.2"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"

      - name: Sign Release APK (Production or Fallback Debug Key)
        id: sign_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p build-artifacts
          RELEASE_UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_RELEASE="build-artifacts/VoterSearch-v${{ env.APP_VERSION }}-release.apk"

          # Find latest apksigner in Android SDK build-tools
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            echo "Signing with repository secret keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
            "$APKSIGNER" sign \
              --ks /tmp/release.keystore \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass pass:"${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" \
              --out "$SIGNED_RELEASE" \
              "$RELEASE_UNSIGNED"
            rm -f /tmp/release.keystore
            echo "Release APK signed with custom key."
          else
            echo "No custom keystore secrets found. Signing release APK with debug key so it is installable out of the box..."
            DEBUG_KS="$HOME/.android/debug.keystore"
            if [ ! -f "$DEBUG_KS" ]; then
              keytool -genkeypair -v -keystore "$DEBUG_KS" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
            "$APKSIGNER" sign \
              --ks "$DEBUG_KS" \
              --ks-pass pass:android \
              --ks-key-alias androiddebugkey \
              --key-pass pass:android \
              --out "$SIGNED_RELEASE" \
              "$RELEASE_UNSIGNED"
            echo "Release APK signed with debug keystore."
          fi

      - name: Prepare Artifacts & Checksums
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "build-artifacts/VoterSearch-v${{ env.APP_VERSION }}-debug.apk"
          cd build-artifacts
          sha256sum *.apk > checksums.txt
          cat checksums.txt
          cd ..

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoterSearch-v${{ env.APP_VERSION }}-APKs
          path: |
            build-artifacts/*.apk
            build-artifacts/checksums.txt
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-artifacts/*.apk
            build-artifacts/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
